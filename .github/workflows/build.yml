
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies & JAXB
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          git \
          zip \
          unzip \
          python3-dev \
          libffi-dev \
          libssl-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libjaxb-java

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Install Android Build Tools
      run: |
        sdkmanager "platform-tools" "build-tools;37.0.0"

    - name: Link Android SDK for Buildozer
      run: |
        mkdir -p "$HOME/.buildozer/android/platform"
        rm -rf "$HOME/.buildozer/android/platform/android-sdk"
        ln -s "$ANDROID_HOME" "$HOME/.buildozer/android/platform/android-sdk"

    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer
        pip install cython==0.29.36

    - name: Build APK
      run: |
        export ANDROID_HOME="$ANDROID_HOME"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        python3 -m buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: manou-social-apk
        path: bin/*.apk
